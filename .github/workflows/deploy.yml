deploy:
  name: Deploy image to EC2
  runs-on: ubuntu-latest
  needs: build-and-push
  timeout-minutes: 10

  steps:
    - name: Configure SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        EC2_HOST: ${{ secrets.EC2_HOST }}
      run: |
        set -euo pipefail

        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

        ssh-keyscan -H "$EC2_HOST" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - name: Deploy container
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        IMAGE_NAME: ${{ env.IMAGE_NAME }}
        IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
      run: |
        set -euo pipefail

        ssh \
          -o ConnectTimeout=20 \
          -o ServerAliveInterval=15 \
          -i ~/.ssh/id_rsa \
          "$EC2_USERNAME@$EC2_HOST" \
          "IMAGE_NAME='$IMAGE_NAME' \
           IMAGE_TAG='$IMAGE_TAG' \
           CONTAINER_NAME='$CONTAINER_NAME' \
           bash -s" <<'REMOTE_SCRIPT'

        set -euo pipefail

        echo "Pulling image: ${IMAGE_NAME}:${IMAGE_TAG}"
        docker pull "${IMAGE_NAME}:${IMAGE_TAG}"

        docker rm -f "${CONTAINER_NAME}-new" 2>/dev/null || true

        docker run -d \
          --name "${CONTAINER_NAME}-new" \
          -p 3001:3000 \
          --restart unless-stopped \
          "${IMAGE_NAME}:${IMAGE_TAG}"

        healthy=false

        for attempt in $(seq 1 12); do
          if curl --fail --silent \
            http://localhost:3001/health >/dev/null; then
            healthy=true
            break
          fi

          echo "Health check attempt ${attempt} failed"
          sleep 5
        done

        if [ "$healthy" != "true" ]; then
          echo "New container failed its health check"
          docker logs "${CONTAINER_NAME}-new" || true
          docker rm -f "${CONTAINER_NAME}-new" || true
          exit 1
        fi

        docker rm -f "${CONTAINER_NAME}-new"
        docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true

        docker run -d \
          --name "${CONTAINER_NAME}" \
          -p 3000:3000 \
          --restart unless-stopped \
          "${IMAGE_NAME}:${IMAGE_TAG}"

        sleep 5

        if ! curl --fail --silent \
          http://localhost:3000/health >/dev/null; then
          echo "Production container failed its final health check"
          docker logs "${CONTAINER_NAME}" || true
          exit 1
        fi

        echo "Deployment completed successfully"
        docker image prune -f
        REMOTE_SCRIPT

    - name: Display deployment failure message
      if: failure()
      run: |
        echo "::error::Deployment failed. Review the failed step and EC2 container logs."
