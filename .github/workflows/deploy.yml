name: Build, Test and Deploy Node App

on:
  push:
    branches:
      - main

  # Allows manual execution from the Actions page.
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/node-docker-app
  CONTAINER_NAME: node-docker-app

jobs:
  test:
    name: Test Node.js application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image_tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create immutable image tag
        id: image
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy image to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_rsa \
            "$EC2_USERNAME@$EC2_HOST" \
            "IMAGE_NAME='$IMAGE_NAME' \
             IMAGE_TAG='$IMAGE_TAG' \
             CONTAINER_NAME='$CONTAINER_NAME' \
             bash -s" <<'REMOTE_SCRIPT'

          set -euo pipefail

          echo "Pulling image: ${IMAGE_NAME}:${IMAGE_TAG}"
          docker pull "${IMAGE_NAME}:${IMAGE_TAG}"

          echo "Removing previous temporary container if present"
          docker rm -f "${CONTAINER_NAME}-new" 2>/dev/null || true

          echo "Starting new container for health validation"
          docker run -d \
            --name "${CONTAINER_NAME}-new" \
            -p 3001:3000 \
            --restart unless-stopped \
            "${IMAGE_NAME}:${IMAGE_TAG}"

          echo "Waiting for application health check"
          healthy=false

          for attempt in $(seq 1 12); do
            if curl --fail --silent http://localhost:3001/health >/dev/null; then
              healthy=true
              break
            fi

            echo "Health check attempt ${attempt} failed"
            sleep 5
          done

          if [ "$healthy" != "true" ]; then
            echo "New container failed its health check"
            docker logs "${CONTAINER_NAME}-new" || true
            docker rm -f "${CONTAINER_NAME}-new" || true
            exit 1
          fi

          echo "New image passed the health check"

          # Remove the temporary validation container.
          docker rm -f "${CONTAINER_NAME}-new"

          # Replace the old production container.
          docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true

          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p 3000:3000 \
            --restart unless-stopped \
            "${IMAGE_NAME}:${IMAGE_TAG}"

          sleep 5

          if ! curl --fail --silent http://localhost:3000/health >/dev/null; then
            echo "Production container failed its final health check"
            docker logs "${CONTAINER_NAME}" || true
            exit 1
          fi

          echo "Deployment completed successfully"

          # Remove unreferenced images to save disk space.
          docker image prune -f
          REMOTE_SCRIPT

      - name: Display deployment failure message
        if: failure()
        run: |
          echo "::error::Deployment failed. Review the failed step and EC2 container logs."
